name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Forgejo Actions also reads workflow files placed under .github/, but our
# repo uses a separate .forgejo/workflows/ tree there so each side has a
# tuned set. Don't add cross-host detection here — both runners can execute
# the same workflow without harm if they ever do see it.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: discord_ops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      # Tests bind to "postgres" by default (matches docker-compose). On GH the
      # service is reachable as localhost.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/discord_ops_test
      SESSION_SIGNING_SECRET: ci-secret-32-chars-long-enough-for-jwt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        run: bash scripts/ci/backend.sh

      - name: Run regex-only intent eval
        run: bash scripts/ci/eval.sh

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build + test
        run: bash scripts/ci/frontend.sh

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Boot stack + run Playwright
        run: bash scripts/ci/e2e.sh

      - name: Upload stack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-logs
          path: .ci-stack.log

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
