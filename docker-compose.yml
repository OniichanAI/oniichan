name: ai-discord-ops

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_discord_ops_postgres
    environment:
      POSTGRES_DB: discord_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d discord_ops"]
      interval: 5s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: ai_discord_ops_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8

  minio:
    image: minio/minio:latest
    container_name: ai_discord_ops_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_discord_ops_backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:22-alpine
    container_name: ai_discord_ops_frontend
    working_dir: /workspace
    volumes:
      - ./frontend:/workspace
    ports:
      - "4200:4200"
    command: >
      sh -c "if [ -f package.json ]; then npm ci && npm run start -- --host 0.0.0.0 --port 4200; else echo 'Angular scaffold not initialized yet. Run infra/scripts/init-angular.sh'; tail -f /dev/null; fi"

volumes:
  pgdata:
  redisdata:
  minio-data:
